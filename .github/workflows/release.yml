name: release

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: release-please
        uses: googleapis/release-please-action@v4
        id: release

      - name: setup-pnpm
        uses: pnpm/action-setup@v4
        if: ${{ steps.release.outputs.release_created }}
        with:
          version: 10

      - name: setup-node
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: install
        if: ${{ steps.release.outputs.release_created }}
        run: pnpm install

      - name: build
        if: ${{ steps.release.outputs.release_created }}
        run: pnpm run build

      - name: publish
        if: ${{ steps.release.outputs.release_created }}
        run: pnpm -r publish --no-git-checks
        env:
          NPM_CONFIG_PROVENANCE: true
